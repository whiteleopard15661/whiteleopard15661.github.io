<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bouncing Text</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #808080;
    overflow: hidden;
  }
  #bouncer {
    position: absolute;
    top: 0;
    left: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 48px;
    font-weight: bold;
    white-space: nowrap;
    user-select: none;
  }
  #see-more {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 28px;
    font-weight: bold;
    color: #ffffff;
    text-decoration: underline;
    z-index: 10;
  }
</style>
</head>
<body>
<a id="see-more" href="https://drive.google.com/drive/folders/1JX3w6zk5iilvdyH4sFtNs3jQfS335Ido?usp=drive_link" target="_blank" rel="noopener">see more</a>

<div id="bouncer">whiteleopard15661</div>

<script>
  const el = document.getElementById('bouncer');

  const colors = [
    '#e6194B', '#3cb44b', '#4363d8', '#f58231',
    '#911eb4', '#42d4f4', '#f032e6', '#000000',
    '#469990', '#9A6324', '#ffe119', '#bfef45',
    '#fabed4', '#800000', '#dcbeff', '#000075',
    '#a9a9a9', '#ffffff'
  ];

  let x = 100;
  let y = 100;
  let dx = 3.8;
  let dy = 3.8;

  function pickColor() {
    el.style.color = colors[Math.floor(Math.random() * colors.length)];
  }
  pickColor();

  function animate() {
    const maxX = window.innerWidth - el.offsetWidth;
    const maxY = window.innerHeight - el.offsetHeight;

    x += dx;
    y += dy;

    if (x <= 0) {
      x = 0;
      dx = -dx;
      pickColor();
    } else if (x >= maxX) {
      x = maxX;
      dx = -dx;
      pickColor();
    }

    if (y <= 0) {
      y = 0;
      dy = -dy;
      pickColor();
    } else if (y >= maxY) {
      y = maxY;
      dy = -dy;
      pickColor();
    }

    el.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>

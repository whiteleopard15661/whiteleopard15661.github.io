<html lang="en">
<head>
<meta charset="UTF-8">
<title>welcome</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #808080;
    overflow: hidden;
  }
  #bouncer {
    position: absolute;
    top: 0;
    left: 0;
    font-family: "Courier New", Courier, monospace;
    font-size: 48px;
    font-weight: bold;
    white-space: nowrap;
    user-select: none;
    -webkit-text-stroke: 1.5px #000000;
    text-stroke: 1.5px #000000;
    will-change: transform;
  }
  .link-btn {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: "Courier New", Courier, monospace;
    font-size: 28px;
    font-weight: bold;
    color: #ffffff;
    text-decoration: underline;
    z-index: 10;
  }
  #see-more { top: 45%; }
  #find-me   { top: 55%; }
</style>
</head>
<body>
<a id="see-more" class="link-btn" href="https://drive.google.com/drive/folders/1JX3w6zk5iilvdyH4sFtNs3jQfS335Ido?usp=drive_link" target="_blank" rel="noopener">see more pics</a>
<a id="find-me" class="link-btn" href="https://www.instagram.com/whiteleopard15661/" target="_blank" rel="noopener">find me somewhere else</a>

<div id="bouncer">whiteleopard15661</div>

<script>
  const el = document.getElementById('bouncer');

  const colors = [
    '#e6194B', '#3cb44b', '#4363d8', '#f58231',
    '#911eb4', '#42d4f4', '#f032e6', '#000000',
    '#469990', '#9A6324', '#ffe119', '#bfef45',
    '#fabed4', '#800000', '#dcbeff', '#000075',
    '#a9a9a9', '#ffffff'
  ];

  let currentColorIndex = -1;
  let x = 100, y = 100;
  let dx = 3.8, dy = 3.8;
  let maxX = 0, maxY = 0;

  function updateBounds() {
    maxX = window.innerWidth - el.offsetWidth;
    maxY = window.innerHeight - el.offsetHeight;
  }
  window.addEventListener('resize', updateBounds);
  updateBounds();

  function pickColor() {
    // Pick randomly from all indices except the currently active one
    let nextIndex = Math.floor(Math.random() * (colors.length - 1));
    if (nextIndex >= currentColorIndex && currentColorIndex !== -1) {
      nextIndex++;
    }
    currentColorIndex = nextIndex;
    el.style.color = colors[currentColorIndex];
  }
  
  pickColor();

  function animate() {
    x += dx;
    y += dy;

    let bounced = false;

    if (x <= 0) { x = 0; dx = -dx; bounced = true; }
    else if (x >= maxX) { x = maxX; dx = -dx; bounced = true; }

    if (y <= 0) { y = 0; dy = -dy; bounced = true; }
    else if (y >= maxY) { y = maxY; dy = -dy; bounced = true; }

    if (bounced) pickColor();

    el.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
